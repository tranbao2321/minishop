<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Shop</title>
    <!-- Nhúng Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Tạo tiêu đề (Header) -->
    <header class="bg-primary text-white p-3 mb-3">
        <div class="container">
            <h2 class="text-center mb-0">MINI SHOP</h2>
        </div>
    </header>

    <!-- Tạo Menu -->
    <nav class="bg-light p-3 mb-4 shadow-sm">
        <div class="container">
            <a href="#" class="me-3 text-decoration-none text-dark fw-bold">Trang chủ</a>
            <a href="#sanpham" class="text-decoration-none text-dark">Sản phẩm</a>
        </div>
    </nav>

    <!-- Tạo Banner giới thiệu -->
    <section class="container mb-5">
        <div class="bg-light p-5 text-center rounded shadow-sm">
            <h1 class="mb-3">Chào mừng đến Mini Shop</h1>
            <p class="mb-4">Mua sắm dễ dàng - Giá tốt mỗi ngày</p>
            <a href="#sanpham" class="btn btn-dark px-4 py-2">
                Xem sản phẩm
            </a>
        </div>
    </section>

    <!-- Danh sách sản phẩm -->
    <section id="sanpham" class="container mt-4 mb-5">
        <h2 class="text-center mb-4">Sản phẩm nổi bật</h2>
        <div class="row g-4">
            
            <!-- Sản phẩm 1 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow border-0">
                    <img src="images/sp1.jpg" class="card-img-top rounded p-2" alt="Áo thun">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Áo thun</h5>
                        <!-- Giá tiền màu đỏ (text-danger) -->
                        <p class="text-danger fw-bold mb-3">199.000đ</p>
                        <a href="#" class="btn btn-primary mt-auto">Mua ngay</a>
                    </div>
                </div>
            </div>

            <!-- Sản phẩm 2 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow border-0">
                    <img src="images/sp2.jpg" class="card-img-top rounded p-2" alt="Mũ thời trang">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Mũ thời trang</h5>
                        <p class="text-danger fw-bold mb-3">150.000đ</p>
                        <a href="#" class="btn btn-primary mt-auto">Mua ngay</a>
                    </div>
                </div>
            </div>

            <!-- Sản phẩm 3 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow border-0">
                    <img src="images/sp3.jpg" class="card-img-top rounded p-2" alt="Balo du lịch">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Balo du lịch</h5>
                        <p class="text-danger fw-bold mb-3">450.000đ</p>
                        <a href="#" class="btn btn-primary mt-auto">Mua ngay</a>
                    </div>
                </div>
            </div>

            <!-- Sản phẩm 4 -->
            <div class="col-12 col-md-6 col-lg-3">
                <div class="card h-100 shadow border-0">
                    <img src="images/sp4.jpg" class="card-img-top rounded p-2" alt="Kính mát">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Kính mát</h5>
                        <p class="text-danger fw-bold mb-3">250.000đ</p>
                        <a href="#" class="btn btn-primary mt-auto">Mua ngay</a>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-secondary text-white text-center p-4 mt-5">
        <div class="container">
            <p class="mb-0">
                © 2026 Mini Shop - Thiết kế bằng Bootstrap 5
            </p>
        </div>
    </footer>

    <!-- Nhúng Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
